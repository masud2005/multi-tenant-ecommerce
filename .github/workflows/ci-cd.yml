name: CI/CD

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  prepare:
    name: Gate Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.gate.outputs.run_ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide CI requirement
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "dev branch → run lint, typecheck, and build for both apps"
            exit 0
          fi

          shas="${{ github.sha }}"
          if git rev-parse -q --verify HEAD^2 >/dev/null 2>&1; then
            shas="$shas $(git rev-parse HEAD^2)"
            echo "Merge commit detected; also checking source SHA"
          fi

          ci_passed_for_sha() {
            local sha="$1"
            local run_ids
            run_ids=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=${sha}&per_page=30" \
              --jq '[.workflow_runs[]? | select(.conclusion == "success") | .id] | .[]' 2>/dev/null || true)

            for id in $run_ids; do
              local ok
              ok=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" --jq '
                [.jobs[]? | {name: .name, conclusion: .conclusion}] as $jobs
                | ($jobs | any(.name == "Frontend Lint" and .conclusion == "success"))
                  and ($jobs | any(.name == "Frontend Type Check" and .conclusion == "success"))
                  and ($jobs | any(.name == "Frontend Build" and .conclusion == "success"))
                  and ($jobs | any(.name == "Backend Lint" and .conclusion == "success"))
                  and ($jobs | any(.name == "Backend Type Check" and .conclusion == "success"))
                  and ($jobs | any(.name == "Backend Build" and .conclusion == "success"))
              ' 2>/dev/null || echo "false")
              if [ "$ok" = "true" ]; then
                echo "Found successful CI in run ${id} for ${sha}"
                return 0
              fi
            done
            return 1
          }

          for sha in $shas; do
            echo "Checking prior CI for ${sha}"
            if ci_passed_for_sha "$sha"; then
              echo "run_ci=false" >> "$GITHUB_OUTPUT"
              echo "Prior CI passed → skip checks and deploy only"
              exit 0
            fi
          done

          echo "run_ci=true" >> "$GITHUB_OUTPUT"
          echo "No prior successful CI found → run checks before deploy"

  frontend-lint:
    name: Frontend Lint
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  frontend-typecheck:
    name: Frontend Type Check
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  frontend-build:
    name: Frontend Build
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_DESCRIPTION: ${{ vars.NEXT_PUBLIC_APP_DESCRIPTION }}

  backend-lint:
    name: Backend Lint
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - name: Lint
        run: npm run lint

  backend-typecheck:
    name: Backend Type Check
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - name: Typecheck
        run: npm run typecheck

  backend-build:
    name: Backend Build
    needs: prepare
    if: needs.prepare.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  deploy-frontend:
    name: Deploy Frontend
    needs:
      - prepare
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-lint
      - backend-typecheck
      - backend-build
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' &&
      (
        needs.prepare.outputs.run_ci != 'true' ||
        (
          needs.frontend-lint.result == 'success' &&
          needs.frontend-typecheck.result == 'success' &&
          needs.frontend-build.result == 'success' &&
          needs.backend-lint.result == 'success' &&
          needs.backend-typecheck.result == 'success' &&
          needs.backend-build.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-frontend
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel production
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment URL: ${deployment_url}"

  deploy-backend:
    name: Deploy Backend
    needs:
      - prepare
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-lint
      - backend-typecheck
      - backend-build
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' &&
      (
        needs.prepare.outputs.run_ci != 'true' ||
        (
          needs.frontend-lint.result == 'success' &&
          needs.frontend-typecheck.result == 'success' &&
          needs.frontend-build.result == 'success' &&
          needs.backend-lint.result == 'success' &&
          needs.backend-typecheck.result == 'success' &&
          needs.backend-build.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backend
    defaults:
      run:
        working-directory: backend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ] && [ -f .vercel/.env.production.local ]; then
            export DATABASE_URL=$(grep -E '^DATABASE_URL=' .vercel/.env.production.local | head -n 1 | cut -d '=' -f2- | tr -d '"\r')
          fi
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Applying Prisma migrations to production database..."
            npx prisma migrate deploy
          else
            echo "::warning ::No DATABASE_URL found in secrets or .vercel/.env.production.local. Skipping database migration."
          fi
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel production
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment URL: ${deployment_url}"
